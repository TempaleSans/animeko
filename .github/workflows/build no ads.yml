name: Auto Patch & Build APK

on:
  schedule:
    - cron: '0 0 * * *' # 每天早 8 点自动运行
  workflow_dispatch: # 支持手动点 Run

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 Animeko 官方最新代码
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'open-ani/animeko'
          fetch-depth: 0

      # 2. 打入去广告补丁
      - name: Apply No-Ads Patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add patch_src https://github.com/LucasChan02/animeko.git
          git fetch patch_src
          git cherry-pick --strategy-option=theirs 391936795812373f1301e94b7a9e1e186dcd456b || true

      # 3. 设置 Java 环境（JDK 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 配置 Gradle 缓存以加速编译
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. 赋予 gradlew 执行权限并编译 Android Release APK
      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace

      # 6. 上传打包好的去广告 APK 供下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animeko-Android-NoAds
          path: |
            androidApp/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk


        uses: actions/upload-artifact@v4
        with:
          name: Animeko-iOS-NoAds
          path: build/ios/iphoneos/Animeko_NoAds.ipa
