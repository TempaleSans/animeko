name: Auto Patch & Build APK

on:
  workflow_dispatch: # 手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Official Code
        uses: actions/checkout@v4
        with:
          repository: 'open-ani/animeko'
          fetch-depth: 0

      - name: Apply No-Ads Patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add patch_src https://github.com/LucasChan02/animeko.git
          git fetch patch_src
          git cherry-pick --strategy-option=theirs 391936795812373f1301e94b7a9e1e186dcd456b || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animeko-Android-NoAds
          path: |
            androidApp/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk



        uses: actions/upload-artifact@v4
        with:
          name: Animeko-iOS-NoAds
          path: build/ios/iphoneos/Animeko_NoAds.ipa
